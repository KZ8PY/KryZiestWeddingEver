<html lang="en" class="js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Table Location | Ziber&Krysha</title>
  <link rel="icon" type="image/png" href="../../public/images/icons/KZ-Monogram.png">
  <link rel="alternate icon" href="../../public/favicon.ico">
  <link rel="preload" href="../../src/fonts/tan-pearl-converted/TAN-PEARL-Regular.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="../../src/css/variables.css">
  <link rel="stylesheet" href="../../src/css/base.css">
  <link rel="stylesheet" href="../../src/css/layout.css">
  <link rel="stylesheet" href="../../src/css/components/hero.css">
  <link rel="stylesheet" href="../../src/css/animations.css">
  <link rel="stylesheet" href="../../src/css/components/sidebar.css">
  <link rel="stylesheet" href="../../src/css/components/glass.css">
  <link rel="stylesheet" href="../../src/css/components/guest-table-location.css?v=20260506a">
</head>
<body>
  <div class="floating-home-group">
    <a href="../../#home" class="home-icon-btn" aria-label="Return to home page">
      <img src="../../public/images/icons/home.svg" alt="Home" aria-hidden="true">
    </a>
  </div>

  <header class="sticky-header latte-frame site-header" role="banner">
    <div class="header-brand">
      <h1 class="header-site-title">Ziber &amp;Krysha</h1>
    </div>
  </header>

  <main id="main-content">
    <section id="table-location" class="fade-in section" aria-label="Guest table location">
      <div class="table-location-layout">
      <h2 id="tableLocationTitle" class="table-location-page-title">Table location</h2>

      <article class="table-location-card frosted-panel std-glass">
      <p id="tableLocationSubtitle">Your layout preview will appear below.</p>

      <div class="layout-wrap">
        <img id="tableLayoutImage" src="" alt="Table layout" hidden>
        <p id="layoutFallback" class="layout-fallback">Loading layout image...</p>
      </div>

      <div class="table-location-actions">
        <a class="table-action" id="backToFinder" href="../">Back to guest seat finder</a>
        <a class="table-action" href="../../#home">Go to e-vite</a>
      </div>

      </article>
      </div>
    </section>
  </main>

  <script src="../../src/js/main.js" defer></script>
  <script src="../../src/js/table-location.js?v=20260506a" defer></script>
</body>
</html>
